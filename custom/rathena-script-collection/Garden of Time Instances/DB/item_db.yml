Body:
  - Id: 102433
    AegisName: Unsealing_Scroll
    Name: Unsealing Scroll
    Type: Usable
    Weight: 100
    Flags:
      BuyingStore: true
    Script: |
      if ( getstatus(SC_BLOCK_SEAL) )
        sc_end SC_BLOCK_SEAL;
  - Id: 102434
    AegisName: Warm_Shield_Scroll
    Name: Warm Shield Scroll
    Type: Usable
    Weight: 100
    Flags:
      BuyingStore: true
    Script: |
      sc_start SC_WARM_SHIELD, 30000, 0;

