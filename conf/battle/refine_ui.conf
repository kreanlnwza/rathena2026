// Refine UI Protection Configuration
// Anti Speed-Hack delays for Refine UI [@krit.k #3614]

// Refine UI delay time in milliseconds between refine attempts
// This prevents players from attempting to refine too quickly
// Default: 1800 (1.8 seconds)
refine_delay_time: 1800

// Refine UI lock time in milliseconds after each refine attempt
// This prevents players from clicking the refine button again too quickly
// Default: 5000 (5 seconds)
refine_ui_lock_time: 5000
