//--------------------------------------------------------------
// rAthena Per-IP Connection Limit Configuration
//--------------------------------------------------------------
// Controls how many simultaneous game connections are allowed
// from a single IP address. Useful to prevent multi-clienting
// via VMware, VirtualBox, Sandbox, etc.
//--------------------------------------------------------------

// Maximum simultaneous game connections per IP address.
// Set to -1 for unlimited (default).
max_connect_user_per_ip: 1

// Minimum group_id that is exempt from per-IP connection limit.
// Players with group_id >= this value bypass the limit.
// Default: 99 (only super-admin bypasses)
max_connect_user_per_ip_gm_allow_group: 99

//--------------------------------------------------------------
// Prevent Change IP
//--------------------------------------------------------------
// Prevents account login from a different IP while already online.
// Useful to protect players from account theft (attacker can't kick
// the real player even with stolen credentials).
//
// 0 = disabled (default, rAthena default behavior: kick old session)
// 1 = block new IP login while account is online (protect current player)
// 2 = allow new IP login but disconnect old session (like default but with logging)
//
// GM accounts (group_id >= gm_allow_group) are exempt.
//--------------------------------------------------------------
prevent_change_ip: 0

//--------------------------------------------------------------
// IP/Subnet Whitelist
//--------------------------------------------------------------
// IPs or subnets listed here are exempt from the per-IP limit.
// Use this for internet cafes, offices, shared networks, or
// CGNAT ISPs where many players share the same public IP.
//
// Supported formats:
//   ip_connection_whitelist: 203.150.100.5          (single IP)
//   ip_connection_whitelist: 192.168.1.0/24         (CIDR notation)
//   ip_connection_whitelist: 10.0.0.0/255.0.0.0     (subnet mask)
//
// Add one line per IP/subnet. No limit on number of entries.
//--------------------------------------------------------------

//ip_connection_whitelist: 127.0.0.1
//ip_connection_whitelist: 192.168.1.0/24
//ip_connection_whitelist: 10.0.0.0/8
