###########################################################################
# Barter Database
###########################################################################
#
# Barter Settings
#
###########################################################################
#  - Name               NPC name.
#    Map                Map name. (Default: not on a map)
#    X                  Map x coordinate. (Default: 0)
#    Y                  Map y coordinate. (Default: 0)
#    Direction          Direction the NPC is looking. (Default: North)
#    Sprite             Sprite name of the NPC. (Default: FakeNpc)
#    Items:             List of sold items.
#      - Index          Index of the item inside the shop. (0-...)
#                       Maximum index depends on client.
#        Item           Aegis name of the item.
#        Stock          Amount of item in stock. 0 means unlimited. (Default: 0)
#        Zeny           Cost of them item in Zeny. (Default: 0)
#        Refine         Refine level of the item. (Default: 0)
#        RequiredItems: List of required items (Optional)
#          - Index      Index of the required item. (0-4)
#            Item       Aegis name of required item.
#            Amount     Amount of required item. (Default: 1)
#            Refine     Refine level of required item. (Default: 0)
###########################################################################

Header:
  Type: BARTER_DB
  Version: 2

Body:
###########################################################################
##= Example Craft Shop
##= NPC script: npc/custom/craft_npc.txt
##= callshop "barter_Craft_Example"
###########################################################################
  - Name: barter_Craft_Example
    Craft: true
    Items:
      # --- Recipe 1: Elunium (50% chance, requires 10 Iron_Ore + 5 Steel) ---
      - Index: 0
        Item: Elunium
        SuccessRate: 5000
        RequiredItems:
          - Index: 0
            Item: Iron_Ore
            Amount: 10
          - Index: 1
            Item: Steel
            Amount: 5

      # --- Recipe 2: Oridecon (30% chance, requires 20 Iron_Ore + 3 Rough_Oridecon) ---
      - Index: 1
        Item: Oridecon
        SuccessRate: 3000
        RequiredItems:
          - Index: 0
            Item: Iron_Ore
            Amount: 20
          - Index: 1
            Item: Rough_Oridecon
            Amount: 3

      # --- Recipe 3: Rough_Elunium (80% chance, requires 5 Iron_Ore, stock limited 100) ---
      - Index: 2
        Item: Rough_Elunium
        SuccessRate: 8000
        Stock: 100
        RequiredItems:
          - Index: 0
            Item: Iron_Ore
            Amount: 5
